# Entity System Registry (this repo's slice; per the Conformance Standard CS-011).
# Data-driven configuration for the entity-system gate
# (scripts/check_entity_system.py). The registry declares the
# InformationClass profile so the gate enforces the IC envelope on
# every record under entities/**.

envelope:
  file_globs:
    - "entities/**/*.yaml"
  type_field: type
  profiles:
    InformationClass:
      required_fields:
        - id
        - type
        - name
        - definition
        - sensitivity
        - regulatory_regime
        - lifecycle
        - provenance

identity:
  id_field: id
  canonical_prefix: "dea:"
  canonical_pattern: "^dea:information-class-[a-z0-9-]+$"
  legacy_prefix: "dea:"
  legacy_pattern: "^dea:entity-information-class-[a-z0-9-]+$"

relationships:
  field: relationships
  canonical_types:
    - dea:maps-to
  forbidden_types:
    - part-of
  cross_catalog_field: identity_scope

lifecycle:
  field: lifecycle
  status_field: status
  valid_states:
    - planned
    - active
    - deprecated
  terminal_states:
    - deprecated
  transition_table:
    planned:
      - active
      - deprecated
    active:
      - deprecated
  provenance_field: provenance.change_history
  provenance_required_keys:
    - cr
    - date
    - change

per_type_gates: []

exceptions:
  registry_path: reconciliation/normalization.yaml
  verdict_key: verdict
  verdict_value: review-retained
  cr_key: cr
  expiry_key: expiry
  reviewer_key: reviewed_by
  excepted_rules_key: excepted_rules
