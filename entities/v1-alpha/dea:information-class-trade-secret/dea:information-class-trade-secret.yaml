id: dea:information-class-trade-secret
type: InformationClass
name: Trade Secret
description: Information deriving economic value from not being generally known and subject to reasonable secrecy efforts. Protected by trade-secret statute rather than a named regulatory regime; disclosure destroys the class's value.
version: 1.0.0
lifecycle_status: active
sensitivity: restricted
regulatory_regime: [none]
handling_requirements:
  - Documented reasonable secrecy efforts (access controls, NDAs, marking) must be maintained; their absence forfeits protection.
  - Access restricted to personnel with a demonstrated business need and a contractual confidentiality obligation.
  - Encryption in transit and at rest.
  - Disclosure events are logged; third-party disclosure requires a written confidentiality agreement.
retention: Indefinite while secrecy is maintained and value persists; no statutory retention floor.
governance:
  functional_owner: Emmanuel A. Otchere
  steward: Emmanuel A. Otchere
  approval_status: approved
  source_and_evidence: "Trade-secret statutes applicable to the operating jurisdictions (e.g. DTSA, EU Trade Secrets Directive); internal intellectual-property policy; owner: Legal function."
metadata:
  established_by: CR-IC-CAT-07
