id: dea:information-class-phi
type: InformationClass
name: Protected Health Information (PHI)
description: Health information that identifies an individual, created or received in the provision of care, payment, or healthcare operations. Health-privacy regimes govern its use, disclosure, and breach notification.
version: 1.0.0
lifecycle_status: active
sensitivity: restricted
regulatory_regime: [PHI]
handling_requirements:
  - Access restricted to workforce members with treatment, payment, or operations roles.
  - The minimum-necessary standard applies to all uses and disclosures.
  - Encryption in transit and at rest.
  - Disclosure logging and breach-notification readiness within statutory deadlines.
mandated_controls:
  - control: dea:control-treatment-role-access
    requirement: "Restrict access to workforce members with treatment, payment, or operations roles."
  - control: dea:control-minimum-necessary-enforcement
    requirement: "Enforce the minimum-necessary standard on all uses and disclosures."
  - control: dea:control-encryption-at-rest-and-transit
    requirement: "Apply encryption in transit and at rest."
  - control: dea:control-disclosure-logging
    requirement: "Log disclosures and maintain breach-notification readiness."
retention: Per health-records retention statutes in the operating jurisdictions.
governance:
  functional_owner: Emmanuel A. Otchere
  steward: Emmanuel A. Otchere
  approval_status: approved
  source_and_evidence: "Health-privacy regimes applicable to the operating jurisdictions (e.g. HIPAA); internal health-information policy; owner: Privacy / Compliance function."
metadata:
  established_by: CR-IC-CAT-04
