id: dea:information-class-phi
type: InformationClass
name: Protected Health Information (PHI)
definition: Health information identifying an individual, protected under health-privacy regimes (e.g. HIPAA).
sensitivity: restricted
regulatory_regime: [PHI]
handling_requirements:
  - Access restricted to workforce members with treatment/payment/operations roles.
  - Minimum-necessary standard applies to all uses and disclosures.
  - Encryption in transit and at rest.
  - Disclosure logging and breach-notification readiness.
retention: Per health-records retention statute.
lifecycle:
  status: active
