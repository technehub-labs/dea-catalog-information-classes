name: validate-catalogue

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: catalogue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Step 1: YAML and JSON parsing"
        run: |
          set -euo pipefail
          python3 scripts/check_parse.py

      - name: "Step 2: Pointer present and internally consistent"
        run: |
          set -euo pipefail
          python3 scripts/check_pointer.py

      - name: "Step 3: Schema projection present and valid"
        run: |
          set -euo pipefail
          python3 scripts/check_schema_projection.py

      - name: "Step 4: D-004 and D-005 compliance"
        run: |
          set -euo pipefail
          python3 scripts/check_writing_rules.py

      - name: "Step 5: Records directory posture"
        run: |
          set -euo pipefail
          python3 scripts/check_record_posture.py

      - name: "Step 6: Classification taxonomy"
        run: |
          set -euo pipefail
          python3 scripts/check_taxonomy.py

      - name: "Step 7: Record documentation standard"
        run: |
          set -euo pipefail
          python3 scripts/check_record_documentation.py

      - name: "Step 8: Cross-catalogue crosswalk"
        run: |
          set -euo pipefail
          python3 scripts/check_crosswalk.py
