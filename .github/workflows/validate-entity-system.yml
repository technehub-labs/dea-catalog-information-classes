name: validate-entity-system

# General Entity System conformance gate (CR-BP-123). Runs the
# per-repo entity-system gate against the live tree on every push
# and PR. The gate enforces:
#   ES-001 (Identity): present, format-valid, unique id.
#   ES-002 (Entity Contract): common envelope + InformationClass profile.
#   ES-003 (Relationship): canonical types, cross-catalog scope.
#   ES-004 (Lifecycle): governed states, provenance per transition.
#   ES-005 (Conformance Umbrella).
# Per-repo registry: reconciliation/entity-system-registry.yaml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  entity-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Run Entity System gate (--strict)
        run: python3 scripts/check_entity_system.py --strict
        continue-on-error: true
      - name: Run Entity System gate (--self-test)
        run: python3 scripts/check_entity_system.py --self-test
