name: validate-entries

# Validates every entities/**/*.yaml record against
# schemas/information-class.schema.json (JSON Schema draft 2020-12).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  entries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml jsonschema
      - name: Validate entity records against schema
        run: python3 scripts/validate_entries.py --strict
